[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://web.telegram.org; form-action 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com; script-src 'self' https://unpkg.com https://telegram.org; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/packs/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/supabase/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
