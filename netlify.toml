[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self)"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; script-src 'self' https://unpkg.com https://telegram.org; style-src 'self' 'unsafe-inline' https://unpkg.com; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; frame-ancestors 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/packs/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/supabase/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
